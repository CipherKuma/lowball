[package]
name = "mock-desk"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
publish = false
description = "Test double for the Chain Signatures payout desk: records pay_evm calls, can be told to fail"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "~5.27"

[workspace]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
