[package]
name = "lowball-it"
version = "0.1.0"
edition = "2021"
publish = false

# Sandbox integration tests. Own workspace on purpose: the contract itself builds with Rust 1.86
# (nearcore VM requirement) while near-workspaces needs a newer toolchain.
[workspace]

[dependencies]
near-workspaces = "~0.23"
tokio = { version = "1", features = ["full"] }
ed25519-dalek = "2"
sha2 = "0.10"
serde_json = "1"
hex = "0.4"
base64 = "0.22"
borsh = { version = "1", features = ["derive"] }
anyhow = "1"
