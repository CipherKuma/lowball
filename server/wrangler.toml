name = "lowball-server"
main = "src/index.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# D1: `wrangler dev` uses a local sqlite copy. The integrator creates the real database and
# replaces database_id before deploying (`wrangler d1 create lowball`).
[[d1_databases]]
binding = "DB"
database_name = "lowball-game"
database_id = "7f265ec1-eaa9-4a8c-9041-4a963e98a91e"
migrations_dir = "migrations"

[vars]
# Contract and house ids come from src/generated/config.json (npm run sync); set here to override.
# NEAR AI own-fleet Confidential TEE model (owned_by "nearai"); see MODELS.md. Never an Incognito (Anthropic/OpenAI) id.
NEARAI_MODEL = "Qwen/Qwen3.6-35B-A3B-FP8"
SEASON_DAYS = "6"
BOND_NEAR = "0.05"
# A season costs the house about 0.18 NEAR (measured 14 Nov) and at most ~0.4 in the worst case; 0.6 keeps that margin.
MIN_TREASURY_NEAR = "0.6"
MAX_SESSIONS_PER_IP_HOUR = "8"
# Spend caps enforced by code (src/pricing.ts): POST /api/session answers 402 BUDGET_EXHAUSTED once the D1 ledger of
# NEAR AI token spend reaches this many USD; ElevenLabs upstream calls are capped per session (cache hits are free).
NEARAI_BUDGET_USD = "8"
TTS_MAX_PER_SESSION = "80"
# Cross-chain payout relayer: desk defaults to desk.<contract>; Sepolia RPCs default to public providers.
# DESK_ACCOUNT_ID = "desk.lowball-ck.testnet"
# SEPOLIA_RPC_URLS = "https://ethereum-sepolia-rpc.publicnode.com,https://sepolia.drpc.org"
ALLOWED_ORIGIN = "*"

# OutLayer TEE buyers, per season: TEE_MODE = auto | on | off (default auto).
#  auto: a season signs inside Intel TDX enclaves ("enclave") only when OutLayer looks healthy (>= 80% of the last 10
#        jobs ok, one ok in the last 30 min, p90 < 75 s; with no recent data one 60 s probe job decides), else the
#        server signs with the buyers' pact keys ("standard"). on: always enclave. off: always standard.
#  Right before create_season the Worker registers the buyers' keys for the chosen mode (register_buyer_key) under a
#  lock, because the contract snapshots them there. See src/tee/mode.ts and outlayer/deployed.json.
# 17 Nov: every enclave sign_pact job failed in 11-18 s (both attempts) while probes passed, so auto kept picking
# enclave mode and no cartel could form. Live seasons run standard mode until that path is fixed; "auto" restores it.
TEE_MODE = "off"
# NEAR attached to each OutLayer request_execution: the run (0.0071) plus output storage (1e19 yocto per byte, 8 KB = 0.082).
# The unused part is refunded. 0.0071 alone made OutLayer refuse to store the 2 KB sign_pact output (output_storage_unpaid).
OUTLAYER_DEPOSIT_NEAR = "0.09"
