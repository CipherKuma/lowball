name = "lowball-server"
main = "src/index.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

# D1: `wrangler dev` uses a local sqlite copy. The integrator creates the real database and
# replaces database_id before deploying (`wrangler d1 create lowball`).
[[d1_databases]]
binding = "DB"
database_name = "lowball"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Contract and house ids come from src/generated/config.json (npm run sync); set here to override.
# NEAR AI own-fleet Confidential TEE model (owned_by "nearai"); see MODELS.md. Never an Incognito (Anthropic/OpenAI) id.
NEARAI_MODEL = "z-ai/glm-5.3-flash"
SEASON_DAYS = "6"
BOND_NEAR = "0.2"
MIN_TREASURY_NEAR = "1.5"
MAX_SESSIONS_PER_IP_HOUR = "8"
# Spend caps enforced by code (src/pricing.ts): POST /api/session answers 402 BUDGET_EXHAUSTED once the D1 ledger of
# NEAR AI token spend reaches this many USD; ElevenLabs upstream calls are capped per session (cache hits are free).
NEARAI_BUDGET_USD = "8"
TTS_MAX_PER_SESSION = "40"
# Cross-chain payout relayer: desk defaults to desk.<contract>; Sepolia RPCs default to public providers.
# DESK_ACCOUNT_ID = "desk.lowball-ck.testnet"
# SEPOLIA_RPC_URLS = "https://ethereum-sepolia-rpc.publicnode.com,https://sepolia.drpc.org"
ALLOWED_ORIGIN = "*"
