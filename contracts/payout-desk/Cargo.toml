[package]
name = "payout-desk"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Lowball payout desk: pays slashed NEAR out as Sepolia ETH via NEAR Chain Signatures"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "~5.27", features = ["unstable"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "~5.27", features = ["unit-testing", "unstable"] }

# mock-signer is a test double (sandbox only). The sandbox tests in it/ are their own workspace.
[workspace]
members = [".", "mock-signer"]
exclude = ["it"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
