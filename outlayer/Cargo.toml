[package]
name = "lowball-buyer"
version = "0.1.0"
edition = "2021"
description = "Lowball buyer agent: a WASI P2 job for OutLayer (Intel TDX) that decides with NEAR AI Cloud and signs with a TEE-derived ed25519 key"
publish = false

[[bin]]
name = "lowball-buyer"
path = "src/main.rs"

[dependencies]
wit-bindgen = "0.36"
# vendored 0.2.1 with chunked request-body writes (see vendor/wasi-http-client/src/request.rs)
wasi-http-client = { path = "vendor/wasi-http-client" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

[features]
stub-sign = []
